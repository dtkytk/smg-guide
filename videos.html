<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEOS | SMG GUIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="page-header">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="mark">🌸</span>
      <div>
        <div class="brand-name">SMG</div>
        <div class="brand-sub">SAKURA&nbsp;MIRAGE</div>
      </div>
    </a>
    <div class="langs">
      <span class="lang-btn" data-lang="jp">JP</span>
      <span class="lang-btn" data-lang="en">EN</span>
      <span class="lang-btn" data-lang="kr">KR</span>
      <span class="lang-btn" data-lang="tr">TR</span>
      <span class="lang-btn" data-lang="de">DE</span>
    </div>
  </div>
  <p class="page-eyebrow">▶ <span data-i18n="eyebrow_videos">動画</span></p>
  <h1 class="page-title">VIDEOS</h1>
  <p class="breadcrumb"><a href="index.html">HOME</a> ／ VIDEOS</p>
</header>

<main class="page-body">
  <a class="back-link" href="index.html" data-i18n="back_to_top">‹ トップページへ戻る</a>
  <div id="list">
    <div class="empty-state" data-i18n="loading">読み込み中…</div>
  </div>
</main>

<footer>
  <h5>🌸 SMG ALLIANCE 🌸</h5>
  <p class="en">TOGETHER WE GROW, TOGETHER WE WIN.</p>
  <p class="copy">© Sakura Mirage Alliance. All Rights Reserved.</p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  let posts = [];

  function render(lang) {
    const list = document.getElementById("list");
    if (!posts.length) {
      list.innerHTML = '<div class="empty-state">' + SMG.t("empty_videos", lang) + '</div>';
      return;
    }
    list.innerHTML = posts.map(p => {
      const urls = SMG.toArray(p.youtube_urls);
      const embeds = urls
        .map(url => {
          const result = SMG.toVideoEmbed(url);
          if (!result) {
            // 埋め込みに対応していないURLは、普通のリンクとして表示する
            return `<p><a href="${SMG.escapeHtml(url)}" target="_blank" rel="noopener">${SMG.escapeHtml(url)}</a></p>`;
          }
          const verticalClass = result.platform === "tiktok" ? " vertical" : "";
          return `<div class="video-embed${verticalClass}"><iframe src="${result.embedUrl}" title="video" allowfullscreen></iframe></div>`;
        })
        .join("");

      return `
        <div class="video-card">
          <h2>${SMG.escapeHtml(SMG.v(p, "title", lang))}</h2>
          <p class="excerpt">${SMG.escapeHtml(SMG.v(p, "content", lang))}</p>
          ${embeds}
          <div class="meta">${SMG.formatDate(p.created_at)}</div>
        </div>
      `;
    }).join("");
  }

  async function init() {
    posts = await SMG.fetchPosts({ category: "VIDEOS" });
    render(SMG.getLang());
  }

  SMG.initLangButtons((lang) => render(lang));
  init();
</script>

</body>
</html>
