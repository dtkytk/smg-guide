<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事投稿 | SMG GUIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="page-header">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="mark">🌸</span>
      <div>
        <div class="brand-name">SMG</div>
        <div class="brand-sub">SAKURA&nbsp;MIRAGE</div>
      </div>
    </a>
    <div class="langs">
      <span class="lang-btn" data-lang="jp">JP</span>
      <span class="lang-btn" data-lang="en">EN</span>
      <span class="lang-btn" data-lang="kr">KR</span>
      <span class="lang-btn" data-lang="tr">TR</span>
      <span class="lang-btn" data-lang="de">DE</span>
    </div>
  </div>
  <p class="page-eyebrow">🔒 <span data-i18n="admin_eyebrow">管理者専用</span></p>
  <h1 class="page-title purple">POST</h1>
  <p class="breadcrumb"><a href="index.html">HOME</a> ／ <span data-i18n="admin_breadcrumb">記事投稿</span></p>
</header>

<main class="page-body admin-wrap">
  <a class="back-link" href="index.html" data-i18n="back_to_top">‹ トップページへ戻る</a>
  <a class="back-link" href="manage.html" style="margin-left:16px;" data-i18n="link_manage">記事の管理・削除はこちら ›</a>
  <a class="back-link" href="stats.html" style="margin-left:16px;">言語選択の統計はこちら ›</a>

  <div class="admin-card">
    <h2 data-i18n="admin_heading">新しい記事を投稿</h2>

    <form id="post-form">
      <div class="field">
        <label for="f-password" data-i18n="label_password">合言葉</label>
        <input type="password" id="f-password" required data-i18n-ph="ph_password" placeholder="合言葉を入力">
      </div>

      <div class="field">
        <label for="f-category" data-i18n="label_category">カテゴリー</label>
        <select id="f-category" required>
          <option value="EVENTS" data-i18n="opt_events">EVENTS(イベント)</option>
          <option value="GUIDES" data-i18n="opt_guides">GUIDES(ガイド)</option>
          <option value="VIDEOS" data-i18n="opt_videos">VIDEOS(動画)</option>
          <option value="NOTICE" data-i18n="opt_notice">NOTICE(お知らせ)</option>
        </select>
      </div>

      <div class="field">
        <label for="f-title" data-i18n="label_title">タイトル</label>
        <input type="text" id="f-title" required data-i18n-ph="ph_title" placeholder="例: 水晶戦争 開催のお知らせ">
      </div>

      <div class="field">
        <label for="f-content" data-i18n="label_content">本文</label>
        <textarea id="f-content" required data-i18n-ph="ph_content" placeholder="本文を入力してください"></textarea>
      </div>

      <details class="field" style="border:1px solid #f0d5e4; border-radius:14px; padding:12px 14px;">
        <summary style="cursor:pointer; font-size:.85rem; font-weight:700; color:var(--purple-deep);" data-i18n="translations_toggle">翻訳を入力する(任意・空欄でもOK)</summary>
        <div style="margin-top:14px;">
          <div class="field">
            <label for="f-title-en" data-i18n="label_title_en">タイトル(英語)</label>
            <input type="text" id="f-title-en" placeholder="例: Crystal War Announcement">
          </div>
          <div class="field">
            <label for="f-content-en" data-i18n="label_content_en">本文(英語)</label>
            <textarea id="f-content-en" placeholder="English content"></textarea>
          </div>
          <div class="field">
            <label for="f-title-kr" data-i18n="label_title_kr">タイトル(韓国語)</label>
            <input type="text" id="f-title-kr" placeholder="예: 수정 전쟁 안내">
          </div>
          <div class="field">
            <label for="f-content-kr" data-i18n="label_content_kr">本文(韓国語)</label>
            <textarea id="f-content-kr" placeholder="한국어 내용"></textarea>
          </div>
          <div class="field">
            <label for="f-title-tr" data-i18n="label_title_tr">タイトル(トルコ語)</label>
            <input type="text" id="f-title-tr" placeholder="Örn: Kristal Savaşı Duyurusu">
          </div>
          <div class="field">
            <label for="f-content-tr" data-i18n="label_content_tr">本文(トルコ語)</label>
            <textarea id="f-content-tr" placeholder="Türkçe içerik"></textarea>
          </div>
          <div class="field">
            <label for="f-title-de" data-i18n="label_title_de">タイトル(ドイツ語)</label>
            <input type="text" id="f-title-de" placeholder="Z.B. Kristallkrieg-Ankündigung">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="f-content-de" data-i18n="label_content_de">本文(ドイツ語)</label>
            <textarea id="f-content-de" placeholder="Deutscher Inhalt"></textarea>
          </div>
        </div>
      </details>

      <div class="field">
        <label for="f-images" data-i18n="label_images">画像(スマホの写真を選択、複数可)</label>
        <input type="file" id="f-images" accept="image/*" multiple>
        <div class="field-hint" data-i18n="hint_images">写真を選ぶと、下にプレビューが表示されます。</div>
        <div class="thumb-preview" id="thumb-preview"></div>
      </div>

      <div class="field">
        <label for="f-youtube" data-i18n="label_youtube">YouTubeリンク(1行に1つ、複数可・任意)</label>
        <textarea id="f-youtube" placeholder="https://www.youtube.com/watch?v=..."></textarea>
      </div>

      <div class="field switch-row">
        <input type="checkbox" id="f-published" checked style="width:20px;height:20px;">
        <label for="f-published" style="margin:0;" data-i18n="label_publish">すぐに公開する(オフにすると下書き保存)</label>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn" data-i18n="submit_btn">投稿する</button>

      <div id="form-msg"></div>
    </form>
  </div>
</main>

<footer>
  <h5>🌸 SMG ALLIANCE 🌸</h5>
  <p class="en">TOGETHER WE GROW, TOGETHER WE WIN.</p>
  <p class="copy">© Sakura Mirage Alliance. All Rights Reserved.</p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const cfg = window.SMG_CONFIG || {};
  const imagesInput = document.getElementById("f-images");
  const preview = document.getElementById("thumb-preview");
  const form = document.getElementById("post-form");
  const submitBtn = document.getElementById("submit-btn");
  const msgBox = document.getElementById("form-msg");

  let selectedFiles = [];

  imagesInput.addEventListener("change", () => {
    selectedFiles = Array.from(imagesInput.files || []);
    preview.innerHTML = "";
    selectedFiles.forEach(file => {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  });

  function showMessage(text, type) {
    msgBox.textContent = text;
    msgBox.className = "form-msg " + type;
  }

  // 1枚の画像をSupabase Storageにアップロードし、公開URLを返す
  async function uploadImage(file) {
    const safeName = Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "");
    const uploadUrl = cfg.SUPABASE_URL.replace(/\/$/, "") + "/storage/v1/object/post-images/" + safeName;

    const res = await fetch(uploadUrl, {
      method: "POST",
      headers: {
        apikey: cfg.SUPABASE_PUBLISHABLE_KEY,
        Authorization: "Bearer " + cfg.SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": file.type || "application/octet-stream"
      },
      body: file
    });

    if (!res.ok) {
      const errText = await res.text();
      console.error("[SMG] 画像アップロード失敗:", errText);
      throw new Error(SMG.t("msg_failed"));
    }

    return cfg.SUPABASE_URL.replace(/\/$/, "") + "/storage/v1/object/public/post-images/" + safeName;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    showMessage(SMG.t("msg_sending"), "ok");

    try {
      const password = document.getElementById("f-password").value;
      const category = document.getElementById("f-category").value;
      const title = document.getElementById("f-title").value.trim();
      const content = document.getElementById("f-content").value.trim();
      const published = document.getElementById("f-published").checked;
      const youtubeUrls = document.getElementById("f-youtube").value
        .split("\n").map(s => s.trim()).filter(Boolean);

      if (!title || !content) {
        showMessage(SMG.t("msg_missing_fields"), "err");
        submitBtn.disabled = false;
        return;
      }

      // 画像を1枚ずつアップロード
      const imageUrls = [];
      for (const file of selectedFiles) {
        showMessage(SMG.t("msg_uploading") + " (" + (imageUrls.length + 1) + "/" + selectedFiles.length + ")", "ok");
        const url = await uploadImage(file);
        imageUrls.push(url);
      }

      showMessage(SMG.t("msg_saving"), "ok");

      const payload = {
        submit_key: password,
        category: category,
        title: title,
        content: content,
        title_en: document.getElementById("f-title-en").value.trim(),
        content_en: document.getElementById("f-content-en").value.trim(),
        title_kr: document.getElementById("f-title-kr").value.trim(),
        content_kr: document.getElementById("f-content-kr").value.trim(),
        title_tr: document.getElementById("f-title-tr").value.trim(),
        content_tr: document.getElementById("f-content-tr").value.trim(),
        title_de: document.getElementById("f-title-de").value.trim(),
        content_de: document.getElementById("f-content-de").value.trim(),
        published: published,
        image_urls: imageUrls,
        youtube_urls: youtubeUrls
      };

      const insertUrl = cfg.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/posts";
      const res = await fetch(insertUrl, {
        method: "POST",
        headers: {
          apikey: cfg.SUPABASE_PUBLISHABLE_KEY,
          Authorization: "Bearer " + cfg.SUPABASE_PUBLISHABLE_KEY,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text();
        console.error("[SMG] 投稿エラー:", errText);
        if (errText.includes("合言葉が間違っています")) {
          showMessage(SMG.t("msg_wrong_password"), "err");
        } else {
          showMessage(SMG.t("msg_failed"), "err");
        }
        submitBtn.disabled = false;
        return;
      }

      showMessage(SMG.t("msg_success"), "ok");
      form.reset();
      selectedFiles = [];
      preview.innerHTML = "";
      applyPlaceholders();

    } catch (err) {
      console.error("[SMG] エラー:", err);
      showMessage("Error: " + err.message, "err");
    } finally {
      submitBtn.disabled = false;
    }
  });

  // placeholder文言も選択中の言語に合わせる
  function applyPlaceholders() {
    document.querySelectorAll("[data-i18n-ph]").forEach(el => {
      el.placeholder = SMG.t(el.dataset.i18nPh);
    });
  }

  SMG.initLangButtons(() => applyPlaceholders());
  applyPlaceholders();
</script>

</body>
</html>
