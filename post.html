<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事 | SMG GUIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="page-header">
  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="mark">🌸</span>
      <div>
        <div class="brand-name">SMG</div>
        <div class="brand-sub">SAKURA&nbsp;MIRAGE</div>
      </div>
    </a>
    <div class="langs">
      <span class="lang-btn" data-lang="jp">JP</span>
      <span class="lang-btn" data-lang="en">EN</span>
      <span class="lang-btn" data-lang="kr">KR</span>
      <span class="lang-btn" data-lang="tr">TR</span>
      <span class="lang-btn" data-lang="de">DE</span>
    </div>
  </div>
  <p class="page-eyebrow" id="eyebrow">記事</p>
  <h1 class="page-title" id="page-title">POST</h1>
  <p class="breadcrumb"><a href="index.html">HOME</a> ／ <span id="crumb-cat">-</span></p>
</header>

<main class="page-body">
  <a class="back-link" id="back-link" href="index.html" data-i18n="back_to_top">‹ 一覧へ戻る</a>
  <div id="detail">
    <div class="empty-state" data-i18n="loading">読み込み中…</div>
  </div>
</main>

<footer>
  <h5>🌸 SMG ALLIANCE 🌸</h5>
  <p class="en">TOGETHER WE GROW, TOGETHER WE WIN.</p>
  <p class="copy">© Sakura Mirage Alliance. All Rights Reserved.</p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  let post = null;

  const categoryPage = {
    EVENTS: "events.html",
    GUIDES: "guides.html",
    VIDEOS: "videos.html",
    NOTICE: "notice.html"
  };

  function render(lang) {
    const detail = document.getElementById("detail");
    if (!post) {
      detail.innerHTML = '<div class="empty-state">' + SMG.t("not_found", lang) + '</div>';
      return;
    }

    const cat = (post.category || "").toUpperCase();
    document.getElementById("eyebrow").textContent = cat;
    document.getElementById("page-title").textContent = cat;
    document.getElementById("crumb-cat").textContent = cat;
    const backHref = categoryPage[cat] || "index.html";
    document.getElementById("back-link").href = backHref;
    document.getElementById("back-link").textContent = "‹ " + cat + SMG.t("back_to_list_suffix", lang);

    const title = SMG.v(post, "title", lang);
    const content = SMG.v(post, "content", lang);
    const images = SMG.toArray(post.image_urls);
    const youtubeUrls = SMG.toArray(post.youtube_urls);

    const gallery = images.length
      ? `<div class="gallery">${images.map(src => `<a href="${SMG.escapeHtml(src)}" target="_blank" rel="noopener"><img src="${SMG.escapeHtml(src)}" alt=""></a>`).join("")}</div>`
      : "";

    const embeds = youtubeUrls
      .map(url => {
        const result = SMG.toVideoEmbed(url);
        if (!result) {
          return `<p><a href="${SMG.escapeHtml(url)}" target="_blank" rel="noopener">${SMG.escapeHtml(url)}</a></p>`;
        }
        if (result.platform === "tiktok") {
          return `<div class="video-embed tiktok-wrap"><blockquote class="tiktok-embed" cite="${SMG.escapeHtml(result.originalUrl)}" data-video-id="${result.videoId}" style="max-width:340px;min-width:280px;"><section></section></blockquote></div>`;
        }
        return `<div class="video-embed"><iframe src="${result.embedUrl}" title="video" allowfullscreen></iframe></div>`;
      })
      .join("");

    detail.innerHTML = `
      <div class="post-detail">
        <span class="cat-tag">${cat}</span>
        <h1>${SMG.escapeHtml(title)}</h1>
        <div class="meta">${SMG.formatDate(post.created_at)}</div>
        <div class="body-text">${SMG.escapeHtml(content)}</div>
        ${embeds}
        ${gallery}
      </div>
    `;

    if (detail.querySelector(".tiktok-embed")) {
      SMG.loadTikTokEmbeds();
    }
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    if (!id) {
      document.getElementById("detail").innerHTML = '<div class="empty-state">' + SMG.t("not_found", SMG.getLang()) + '</div>';
      return;
    }
    const posts = await SMG.fetchPosts({ id });
    post = posts[0] || null;
    render(SMG.getLang());
  }

  SMG.initLangButtons((lang) => render(lang));
  init();
</script>

</body>
</html>
